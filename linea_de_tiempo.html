<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Línea de Tiempo - Evolución de Fedora Linux</title>
    <link rel="stylesheet" href="css/TimeLine.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<base target="_blank">

<style>
/* ===== NAVBAR CONTINUIDAD ===== */
.topnav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  background: rgba(11, 12, 16, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-family: 'Space Grotesk', sans-serif;
}
.topnav__inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1.5rem;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  text-decoration: none;
  color: #f1f5f9;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
}
.brand__dim {
  opacity: 0.45;
  font-weight: 500;
}
.topnav__links {
  display: flex;
  align-items: center;
  gap: 2rem;
}
.topnav__links a {
  color: #94a3b8;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  transition: color 0.2s ease;
  position: relative;
}
.topnav__links a:hover,
.topnav__links a[aria-current="page"] {
  color: #f1f5f9;
}
.topnav__links a[aria-current="page"]::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 100%;
  height: 2px;
  background: #3b82f6;
  border-radius: 2px;
}
.topnav__toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  flex-direction: column;
  gap: 5px;
  padding: 4px;
}
.topnav__toggle span {
  display: block;
  width: 24px;
  height: 2px;
  background: #f1f5f9;
  border-radius: 2px;
  transition: 0.3s;
}
@media (max-width: 640px) {
  .topnav__links { display: none; }
  .topnav__toggle { display: flex; }
}
/* Ajuste para que el hero no quede detrás del nav fijo */
.hero { padding-top: 64px; }
</style>

</head>
<body>

<!-- ===================== NAV ===================== -->
<header class="topnav" id="topnav">
  <div class="topnav__inner">
    <a href="index.html#inicio" class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="28" height="28">
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.4" opacity="0.35"/>
          <path d="M24 8 A16 16 0 0 1 24 40" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="5" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand__text">fedora<span class="brand__dim">.evolución</span></span>
    </a>
    <nav class="topnav__links">
      <a href="index.html#versiones">Versiones</a>
      <a href="index.html#comparativa">Comparativa</a>
      <a href="index.html#timeline-preview">Línea de tiempo</a>
    </nav>
    <button class="topnav__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

    <header class="hero">
        <div class="hero-content">
            <div class="hero-badge">2003 — 2026</div>
            <h1>Evolución de <span class="highlight">Fedora Linux</span></h1>
            <p class="hero-subtitle">Desde Fedora Core 1 (Yarrow) hasta Fedora 44. Una década y media de innovación en software libre.</p>
            <div class="scroll-hint">
                <span>Desplázate para explorar</span>
                <div class="scroll-arrow">→</div>
            </div>
        </div>
        <div class="hero-particles" id="particles"></div>
    </header>

    <main class="timeline-container">
        <div class="timeline-line"></div>

        <div class="timeline-track" id="timelineTrack">
            <!-- Los items se generan via JS -->
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <div class="progress-bar" id="progressBar"></div>

    <div class="nav-buttons">
        <button class="nav-btn" id="btnPrev" title="Anterior">←</button>
        <button class="nav-btn" id="btnNext" title="Siguiente">→</button>
    </div>

    <footer class="footer">
        <p>Fuente: Fedora Project, Wikipedia, endoflife.date · Compilado en 2026</p>
    </footer>

    <script src="js/TimeLine.js"></script>
</body>
</html>
